; comfytime: set the time of day in the 1.12 client, on your screen only.
;
; Lives in the client folder next to WoW.exe. F11 reloads this file (comfyfog reloads its own on the same
; key). Ctrl+PageUp / Ctrl+PageDown move the time by `step` hours, later / earlier.
;
; It writes the time into the client's memory; the server keeps its own. The addresses below were found
; for one WoW.exe by the Ctrl+F12 search (it logs to comfytime.log); another build moves them, and
; comfytime refuses to write if they do not hold a time.

[time]
enabled      = 1       ; 0 = leave the game's own time alone
hour         = 13      ; 0..24, fractions allowed (13.5 = 13:30)
step         = 0.0167  ; hours per Ctrl+PageUp / PageDown (0.0167 = about a minute)
addrMinutes  = 0x00CE9B60
addrFraction = 0x00CE9B64
addrMinutesF = 0x00CE8574

[general]
log          = 1
hook         = 1       ; 0 = load but patch nothing, for bisecting problems
reloadKey    = 122     ; VK_F11
scanKey      = 123     ; VK_F12, with Ctrl: search memory for the game clock (read-only, ~6 minutes)
chainWaitMs  = 10000   ; wait this long for comfygrass / comfyfog to finish attaching first
